# Reverse-Proxy vor dem Dienst. Einziger Zugang von aussen.

upstream jama_mcp_app {
    server app:8080;
    keepalive 16;
}

# Schutz vor Brute-Force auf die Anmeldung. Der Dienst hat zwar eine eigene
# Sperre pro IP, aber die kostet einen Argon2-Hash je Versuch — hier wird schon
# vorher abgeriegelt.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Version nicht ausplaudern.
    server_tokens off;

    # Anhaenge werden base64-kodiert uebertragen und wachsen dabei um ein Drittel.
    client_max_body_size 25m;

    # Sicherheits-Header. Die Content-Security-Policy setzt die Anwendung selbst,
    # damit sie zur ausgelieferten Oberflaeche passt.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        proxy_pass http://jama_mcp_app;
        access_log off;
    }

    location = /admin/api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://jama_mcp_app;
        include /etc/nginx/proxy_params_jama.conf;
    }

    # MCP nutzt Streamable HTTP: Antworten koennen als Ereignisstrom laufen und
    # duerfen deshalb nicht gepuffert werden.
    location /mcp {
        proxy_pass http://jama_mcp_app;
        include /etc/nginx/proxy_params_jama.conf;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://jama_mcp_app;
        include /etc/nginx/proxy_params_jama.conf;
    }
}
