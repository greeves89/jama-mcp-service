# Gemeinsame Proxy-Einstellungen.
#
# Die Weitergabe der echten Client-Adresse ist hier nicht kosmetisch: die
# Anmeldesperre des Dienstes zaehlt Fehlversuche pro IP. Ohne X-Forwarded-For
# saehe der Dienst nur die Adresse des Proxys und wuerde nach fuenf Fehlversuchen
# alle Benutzer gleichzeitig aussperren.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
