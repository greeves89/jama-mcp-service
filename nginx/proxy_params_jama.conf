# Gemeinsame Proxy-Einstellungen.
#
# Die Weitergabe der echten Client-Adresse ist hier nicht kosmetisch: die
# Anmeldesperre des Dienstes zaehlt Fehlversuche pro IP. Ohne X-Forwarded-For
# saehe der Dienst nur die Adresse des Proxys und wuerde nach fuenf Fehlversuchen
# alle Benutzer gleichzeitig aussperren.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Bewusst $remote_addr statt $proxy_add_x_forwarded_for: Letzteres haengt einen
# vom Client mitgeschickten X-Forwarded-For an, statt ihn zu ersetzen. Ein
# Angreifer koennte damit eine beliebige Adresse voranstellen und sich fuer
# jeden Rateversuch eine neue ausdenken — die Anmeldesperre liefe ins Leere.
# Dieser Dienst steht immer direkt hinter diesem Proxy; eine Kette von
# Adressen gibt es also nicht zu erhalten.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
